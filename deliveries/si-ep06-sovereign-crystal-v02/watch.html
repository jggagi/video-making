<script>
const sources={landscape:'B站/si-ep06-sovereign-crystal-v02-bilibili-120s-4k.mp4',portrait:'小红书/si-ep06-sovereign-crystal-v02-xiaohongshu-120s-portrait.mp4'};
const film=document.querySelector('#film'),state=document.querySelector('#state'),download=document.querySelector('#download');
let seekTo=0;
function choose(layout){seekTo=Number.isFinite(film.currentTime)?film.currentTime:0;film.pause();film.src=sources[layout];download.href=sources[layout];document.querySelectorAll('[data-layout]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.layout===layout)));state.textContent='正在读取视频…';film.load();}
