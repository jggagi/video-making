<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111411">
  <title>狂人日记 · 字缝加强样片</title>
  <style>
    :root{color-scheme:dark;--paper:#e9e0cb;--muted:#a29f90;--dim:#77796f;--line:#34382f;--red:#b34a3e;--panel:#181b18;--ink:#111411}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% -20%,#252820 0,var(--ink) 58%);color:var(--paper);font-family:"PingFang SC",system-ui,sans-serif;min-height:100vh}
    main{width:min(1040px,100% - 40px);margin:0 auto;padding:42px 0 52px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
    .eyebrow{color:#9d9b8e;font-size:10px;letter-spacing:3px;margin-bottom:12px}
    h1{font:600 clamp(27px,5vw,38px)/1.2 "Songti SC","STSong",serif;letter-spacing:5px;margin:0}
    .byline{font-size:13px;letter-spacing:2px;color:var(--muted);margin:8px 0 0}
    .meta{color:var(--muted);font-size:11px;letter-spacing:1.6px;text-align:right;line-height:1.8;white-space:nowrap}
    .stage{position:relative;background:#080a09;border:1px solid #34372f;box-shadow:0 22px 64px #0008}
    video{display:block;width:100%;aspect-ratio:16/9;background:#080a09;object-fit:contain}
    .sample-stage:before{content:"20 秒样片";position:absolute;z-index:1;top:13px;right:14px;padding:6px 9px;background:#101310cc;border:1px solid #ffffff24;color:#ded4bf;font-size:10px;letter-spacing:1.8px;pointer-events:none}
    .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0 36px}
    button{appearance:none;border:1px solid #555648;background:#242720;color:var(--paper);font:inherit;font-size:12px;letter-spacing:1px;padding:10px 14px;cursor:pointer;transition:background .15s,border-color .15s}
    button:hover{background:#303329;border-color:#88826b}button.primary{background:#8f3a32;border-color:#a34b40}button.primary:hover{background:#a3483d}
    .hint{color:var(--dim);font-size:11px;margin-left:auto}
    .comparison{border-top:1px solid var(--line);padding-top:22px}
    .compare-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:13px}
    h2{font:500 17px "Songti SC","STSong",serif;letter-spacing:2px;margin:0}
    .compare-head p{color:var(--dim);font-size:11px;margin:0;letter-spacing:.5px}
    .compare-stage{max-width:720px;border-color:#292c26}
    .compare-stage video{aspect-ratio:16/9}
    .compare-actions{display:flex;align-items:center;gap:15px;margin:12px 0 0}
    #status{min-height:18px;color:#c28b76;font-size:11px}
    footer{border-top:1px solid var(--line);margin-top:29px;padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:11px;line-height:1.9}
    .links{display:flex;gap:18px;flex-wrap:wrap}
    a{color:#d8cfbc;text-decoration:none;border-bottom:1px solid #666557;padding-bottom:2px}a:hover{color:#fff}
    @media(max-width:620px){main{width:min(100% - 24px,1040px);padding-top:26px}header{display:block}.meta{text-align:left;margin-top:12px}.actions{margin-bottom:28px}.hint{width:100%;margin:2px 0 0}.compare-head{display:block}.compare-head p{margin-top:7px}.compare-actions{align-items:flex-start;flex-direction:column;gap:5px}footer{display:block}.links{margin-top:12px}}
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">鲁迅 · 1918 / 原文节选</div>
        <h1>狂人日记</h1>
        <p class="byline">字缝加强样片</p>
      </div>
      <div class="meta">20秒 · 字缝加强样片<br>原文节选 · 合成男声</div>
    </header>

    <section aria-label="20秒字缝加强样片">
      <div class="stage sample-stage">
        <video id="sample" controls preload="metadata" playsinline poster="out/madman/final-history-v3-print.png" aria-label="狂人日记字缝加强样片，20秒原文节选，合成男声">
          <source src="out/madman/狂人日记-字缝加强样片-v3-1080p.mp4" type="video/mp4">
          <track kind="subtitles" src="out/madman/狂人日记-字缝加强样片-v3.vtt" srclang="zh" label="原文字幕">
        </video>
      </div>
      <div class="actions">
        <button id="replay-sample" class="primary" type="button">重放 20 秒样片</button>
        <button id="play-original" type="button">对照原版字缝章节</button>
        <span class="hint">播放一段时，另一段会暂停。</span>
      </div>
    </section>

    <section class="comparison" aria-labelledby="comparison-title">
      <div class="compare-head">
        <h2 id="comparison-title">原版章节对照</h2>
        <p>男声配音版 v2 · 章节范围 00:29—00:48.3</p>
      </div>
      <div class="stage compare-stage">
        <video id="original" controls preload="metadata" playsinline poster="out/madman/still-voice-v2-history.png" aria-label="狂人日记男声配音版 v2，字缝章节">
          <source src="out/madman/狂人日记-男声配音版-v2-1080p.mp4" type="video/mp4">
        </video>
      </div>
      <div class="compare-actions">
        <button id="replay-original" type="button">从 00:29 重放原版章节</button>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <footer>
      <span>节选自鲁迅《狂人日记》· 1918</span>
      <nav class="links" aria-label="相关链接">
        <a href="madman-watch.html">观看完整影片</a>
        <a href="out/madman/狂人日记-字缝加强样片-v3-1080p.mp4" download>下载 20 秒样片</a>
      </nav>
    </footer>
  </main>
  <script>
    const sample = document.getElementById('sample');
    const original = document.getElementById('original');
    const status = document.getElementById('status');
    const originalStart = 29;
    const originalEnd = 48.333333333333336;

    const playOriginalChapter = () => {
      sample.pause();
      const start = () => {
        original.currentTime = originalStart;
        original.play().catch(() => {
          status.textContent = '原版影片无法播放，请确认 v2 成片已导出。';
        });
      };
      status.textContent = '';
      if (original.readyState >= 1) {
        start();
      } else {
        original.addEventListener('loadedmetadata', start, {once: true});
        original.load();
      }
    };

    document.getElementById('replay-sample').addEventListener('click', () => {
      original.pause();
      status.textContent = '';
      sample.currentTime = 0;
      sample.play().catch(() => {
        status.textContent = '样片无法播放，请确认 v3 成片已导出。';
      });
    });
    document.getElementById('play-original').addEventListener('click', playOriginalChapter);
    document.getElementById('replay-original').addEventListener('click', playOriginalChapter);

    sample.addEventListener('play', () => original.pause());
    original.addEventListener('play', () => {
      sample.pause();
      if (original.currentTime < originalStart || original.currentTime >= originalEnd) {
        original.currentTime = originalStart;
      }
    });
    original.addEventListener('timeupdate', () => {
      if (original.currentTime >= originalEnd && !original.paused) {
        original.pause();
        original.currentTime = originalEnd;
      }
    });
    sample.addEventListener('error', () => {
      status.textContent = '样片尚未载入，请确认 v3 成片已导出。';
    });
    original.addEventListener('error', () => {
      status.textContent = '原版影片尚未载入，请确认 v2 成片已导出。';
    });
  </script>
</body>
</html>
