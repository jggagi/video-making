<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EP11 · 峡谷材质与运动样片</title>
<style>
  :root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#101211;color:#e8e7df}
  body{max-width:1000px;margin:32px auto;padding:0 20px}
  h1{font-size:24px;font-weight:550;letter-spacing:.02em;margin:0}
  p{color:#a9afa8;margin:8px 0 20px;font-size:14px}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
  button{font:inherit;color:#d8dcd4;background:#222923;border:1px solid #445045;border-radius:6px;padding:7px 18px;cursor:pointer}
  button[aria-pressed=true]{color:#13160e;background:#d9c291;border-color:#d9c291}
  video{display:block;width:auto;max-width:100%;height:min(72vh,780px);margin:auto;background:#080a09}
  .stage{background:#080a09;border:1px solid #303730;padding:12px}
  footer{margin-top:20px;font-size:13px;color:#8e998f}
  a{color:#d9c291}
</style>
<h1>EP11 · 峡谷材质与运动样片</h1>
<p>8 秒局部实验。左为原版，右为 Blender 样片；两版使用同一段音乐和音效，无旁白。</p>
<nav aria-label="切换视频">
  <button type="button" data-mode="comparison" aria-pressed="true">左右对照</button>
  <button type="button" data-mode="new" aria-pressed="false">Blender 单独播放</button>
  <button type="button" data-mode="old" aria-pressed="false">原版单独播放</button>
</nav>
<div class="stage"><video id="study" controls playsinline preload="metadata" src="media/canyon-side-by-side.mp4"></video></div>
<footer>运动样片：原生 1080 × 1920 / 24 fps；对照排版：1440 × 1440。<br>这是造型、材质、灯光和摄影共同调整后的实验，不能单独归因于渲染引擎。<a href="README.md">工程说明</a></footer>
<script>
  const player=document.querySelector('video');
  const sources={comparison:'media/canyon-side-by-side.mp4',new:'media/new-canyon-clean.mp4',old:'media/old-canyon.mp4'};
  for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{
    const time=player.currentTime,wasPlaying=!player.paused;
    for(const peer of document.querySelectorAll('button'))peer.setAttribute('aria-pressed',String(peer===button));
    player.src=sources[button.dataset.mode];
    player.addEventListener('loadedmetadata',()=>{player.currentTime=Math.min(time,player.duration);if(wasPlaying)player.play().catch(()=>{});},{once:true});
    player.load();
  });
</script>
</html>
